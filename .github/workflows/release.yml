name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag must be checked against the default branch

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Compute version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA::7}"
          is_release=false
          prerelease=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            re='^v([0-9]+)\.([0-9]+)\.([0-9]+)(-(alpha|beta|rc)\.([0-9]+))?$'
            if [[ ! "$tag" =~ $re ]]; then
              echo "::error::Tag '$tag' must look like v1.2.3, v1.2.3-rc.1, v1.2.3-beta.1 or v1.2.3-alpha.1"
              exit 1
            fi
            is_release=true
            major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
            [[ -n "${BASH_REMATCH[4]}" ]] && prerelease=true
            base="${major}.${minor}.${patch}"
            plain="${tag#v}"
            name="${plain}+${sha}"
            # Version code: major*1000000 + minor*10000 + patch*100 + stage, where the stage orders pre-releases
            # below the final release: alpha.N = N, beta.N = 30+N, rc.N = 60+N (N capped at 29), final = 99.
            stage=99
            if [[ -n "${BASH_REMATCH[4]}" ]]; then
              n=$(( ${BASH_REMATCH[6]} > 29 ? 29 : ${BASH_REMATCH[6]} ))
              case "${BASH_REMATCH[5]}" in alpha) stage=$n ;; beta) stage=$(( 30 + n )) ;; rc) stage=$(( 60 + n )) ;; esac
            fi
            if (( minor > 99 || patch > 99 )); then
              echo "::error::minor and patch must be at most 99 to fit the version code"
              exit 1
            fi
            code=$(( major * 1000000 + minor * 10000 + patch * 100 + stage ))
            # The changelog must describe this release (exact version, or the x.y.z it belongs to).
            heading=""
            for h in "$plain" "$base"; do
              if grep -qE "^## \[${h//./\\.}\]" CHANGELOG.md; then heading="$h"; break; fi
            done
            if [[ -z "$heading" ]]; then
              echo "::error::CHANGELOG.md has no '## [$plain]' or '## [$base]' section"
              exit 1
            fi
            echo "changelog_heading=$heading" >> "$GITHUB_OUTPUT"
            # Only commits on the default branch may be released.
            default_branch="${{ github.event.repository.default_branch }}"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${default_branch}"; then
              echo "::error::Tag '$tag' is not on the default branch (${default_branch}); merge first"
              exit 1
            fi
            # [Unreleased] must be empty when a release is cut (its entries move under the version heading).
            unreleased=$(awk '/^## \[Unreleased\]/ { f = 1; next } f && /^(## \[|\[[^]]+\]: )/ { exit } f { print }' CHANGELOG.md)
            if grep -q '[^[:space:]]' <<< "$unreleased"; then
              echo "::error::CHANGELOG.md [Unreleased] still has entries; move them under '## [$plain]'"
              exit 1
            fi
          else
            base=$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -n1 | tr -d '#[ ' || true)
            base="${base:-0.0.0}"
            name="${base}-dev+${sha}"
            code="${GITHUB_RUN_NUMBER}"
          fi
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "file_name=${name//+/-}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Version name: $name, version code: $code"

      - name: Test and lint
        run: make check RUN=

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 is not set (see README, Releases)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: make release RUN=

      - name: Collect artifacts
        env:
          FILE_NAME: ${{ steps.version.outputs.file_name }}
          APP_SLUG: ${{ github.event.repository.name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/${APP_SLUG}-${FILE_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/${APP_SLUG}-${FILE_NAME}.aab"
          cp app/build/outputs/mapping/release/mapping.txt "dist/${APP_SLUG}-${FILE_NAME}-mapping.txt"
          rm -f "$RUNNER_TEMP/release.jks"
          # Checksums of every file above, published as an asset so downloads can be verified (README, Download).
          (cd dist && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS")
          mv "$RUNNER_TEMP/SHA256SUMS" dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Extract release notes
        if: steps.version.outputs.is_release == 'true'
        env:
          HEADING: ${{ steps.version.outputs.changelog_heading }}
        run: |
          awk -v h="## [${HEADING}]" '
            index($0, h) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::The CHANGELOG section for $HEADING is empty"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.event.repository.name }}-${{ steps.version.outputs.file_name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: dist/*
